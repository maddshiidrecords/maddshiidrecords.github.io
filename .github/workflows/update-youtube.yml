name: Update YouTube library

# Refreshes data/youtube.json (used by listen.html) from your YouTube channels.
on:
  schedule:
    - cron: "17 */6 * * *"      # every 6 hours
  workflow_dispatch:             # "Run workflow" button in the Actions tab
  push:
    paths:
      - "data/sources.json"      # re-run when you edit your channel/album list
      - "scripts/update-youtube.mjs"

permissions:
  contents: write

concurrency:
  group: update-youtube
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch from YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}   # optional
        run: node scripts/update-youtube.mjs

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/youtube.json)" ]; then
            git config user.name  "maddshiid-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/youtube.json
            git commit -m "Update YouTube library"
            git push
          else
            echo "Nothing new."
          fi
